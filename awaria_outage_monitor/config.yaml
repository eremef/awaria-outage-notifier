name: Awaria Outage Monitor
version: "1.0.0"
slug: awaria_outage_monitor
description: Headless outage monitor for Polish utility providers (Tauron, PGE, Enea, Energa, MPWiK, Stoen, Veolia, etc.)
url: https://github.com/eremef/awaria-outage-notifier
image: "ghcr.io/eremef/awaria-outage-monitor-{arch}"
arch:
  - aarch64
  - amd64
init: false
ports:
  8000/tcp: 8000
options:
  addresses:
    - name: "Dom"
      cityName: "Warszawa"
      voivodeship: "Mazowieckie"
      district: ""
      commune: ""
      streetName: "ul. Marszałkowska"
      streetName1: "Marszałkowska"
      houseNo: "1"
      isActive: true
  enabled_sources:
    - tauron
    - pge
    - stoen
    - mpwik_warszawa
  port: 8000
  show_other_outages: true
schema:
  addresses:
    - name: str
      cityName: str
      voivodeship: str?
      district: str?
      commune: str?
      streetName: str
      streetName1: str?
      streetName2: str?
      houseNo: str
      cityId: int?
      streetId: int?
      isActive: bool?
  enabled_sources:
    - list(tauron|mpwik_wroclaw|mpwik_warszawa|fortum|energa|enea|pge|stoen|wmk|tauron_heat|aquanet|katowickie_wodociagi|veolia_warszawa|veolia_poznan|veolia_lodz|zwik_lodz|wodociagi_plockie|pwik_czestochowa|gdanskie_wodociagi)
  port: port
  show_other_outages: bool
