name: Awaria Outage Monitor
version: "1.0.75-beta.4"
slug: awaria_outage_monitor
stage: experimental
description: Headless outage monitor for Polish utility providers (Tauron, PGE, PGE Toruń heat, MPEC Kielce, EPEC Elbląg, Enea, ENEA Ciepło, Energa Ciepło Kaliskie, Energa, MPWiK, LPWiK Legnica, Bytomskie Wodociągi, Stoen, Veolia, ZWiK Zielona Góra, etc.)
url: https://github.com/eremef/awaria-outage-notifier
image: "ghcr.io/eremef/awaria-outage-monitor"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8000
panel_icon: "mdi:power-plug-off"
panel_title: "Awaria"
homeassistant_api: true
services:
  - "mqtt:want"
ports:
  8000/tcp: 8000
options:
  addresses:
    - name: "Dom"
      cityName: "Warszawa"
      streetName: "Marszałkowska"
      houseNo: "1"
      isActive: true
  enabled_sources:
    - tauron
    - pge
    - stoen
    - mpwik_warszawa
  port: 8000
  show_other_outages: true
  check_interval_minutes: 60
schema:
  addresses:
    - name: str
      cityName: str
      streetName: str
      houseNo: str
      isActive: bool?
  enabled_sources:
    - list(tauron|mpwik_wroclaw|mpwik_warszawa|mpwik_rzeszow|mwik_bydgoszcz|fortum|energa|enea|enea_cieplo|energa_cieplo_kaliskie|eco_sa|epec_elblag|pge|pge_torun_heat|stoen|wmk|wm_radom|tauron_heat|aquanet|bytomskie_wodociagi|katowickie_wodociagi|veolia_warszawa|veolia_poznan|veolia_lodz|zwik_lodz|zwik_zielona_gora|wodociagi_plockie|wodociagi_kieleckie|wodociagi_bialostockie|torunskie_wodociagi|pwik_czestochowa|pwik_olsztyn|wik_opole|pewik_gdynia|gdanskie_wodociagi|mpec_kielce|mpec_rzeszow|opec_gdynia|lpwik_legnica)
  port: port
  show_other_outages: bool
  check_interval_minutes: int
