name: Release Add-on

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Publish Add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@2024.03.0
        with:
          args: |
            --all \
            --target awaria_outage_monitor \
            --image awaria-outage-monitor-{arch} \
            --registry ghcr.io \
            --docker-hub eremef
