name: Daily Outage Scraper Integrity Check

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 AM UTC
  workflow_dispatch: # Allows manual triggers on-demand

jobs:
  # Job 1: Test Rust Scrapers & APIs
  rust-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          
      - name: Run Live Scraper Verification
        run: cargo test --test live_provider_smoke_tests --features smoke-tests --target-dir target_test -- --ignored
        working-directory: src-tauri

  # Job 2: Test Android Custom bridges (Kotlin, WebView, Conscrypt)
  android-instrumentation-tests:
    runs-on: ubuntu-latest # Linux provides KVM virtualization support for the emulator
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
      - uses: actions/checkout@v6
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.toml') }}

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Tauri Android Project (Generate bindings and settings)
        run: npx tauri android build --debug --target x86_64 --apk --ci

      - name: Enable KVM group access
        run: |
          sudo chmod 0666 /dev/kvm
          
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
        working-directory: src-tauri/gen/android
          
      - name: Run Native Android Scrapers on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedX86_64DebugAndroidTest -Pandroid.injected.abi=x86_64 -x :app:rustBuildX86_64Debug -x :app:rustBuildArm64Debug -x :app:rustBuildX86Debug -x :app:rustBuildArmDebug
          working-directory: src-tauri/gen/android
